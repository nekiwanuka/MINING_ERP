<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="title desc">
  <title id="title">Keys</title>
  <desc id="desc">Two red and silver access keys for the login page.</desc>
  <defs>
    <linearGradient id="metal" x1="42" y1="34" x2="178" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7f7f7"/>
      <stop offset="0.45" stop-color="#c9ced4"/>
      <stop offset="1" stop-color="#818994"/>
    </linearGradient>
    <linearGradient id="red" x1="42" y1="24" x2="174" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4a4a"/>
      <stop offset="1" stop-color="#d80707"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="220" height="220" rx="42" fill="#f5f5f5"/>
  <g filter="url(#shadow)" transform="rotate(-18 112 108)">
    <circle cx="74" cy="74" r="31" fill="none" stroke="url(#metal)" stroke-width="14"/>
    <path d="M96 96l76 76" fill="none" stroke="url(#metal)" stroke-width="17" stroke-linecap="round"/>
    <path d="M144 144l18-18M160 160l18-18" fill="none" stroke="#7e8792" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g filter="url(#shadow)" transform="rotate(18 112 110)">
    <circle cx="86" cy="72" r="27" fill="none" stroke="url(#red)" stroke-width="13"/>
    <path d="M105 91l68 68" fill="none" stroke="url(#red)" stroke-width="15" stroke-linecap="round"/>
    <path d="M144 130l15-15M158 144l15-15" fill="none" stroke="#a60606" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>