{% extends 'operations/base.html' %}
{% block title %}{{ title }} | Mining ERP{% endblock %}
{% block content %}
<section class="page-heading form-page-heading">
    <div>
        <p class="eyebrow">Workflow Form</p>
        <h1>{{ title }}</h1>
        {% if subtitle %}<p>{{ subtitle }}</p>{% endif %}
    </div>
</section>

<section class="panel narrow-panel centered-form-panel">
    <form method="post" class="stacked-form" {% if multipart %}enctype="multipart/form-data"{% endif %}>
        {% csrf_token %}
        {% include 'operations/partials/form_fields.html' with form=form %}
        <div class="form-actions">
            <a class="secondary-button" href="{% url cancel_url %}">Cancel</a>
            <button class="primary-button" type="submit">{{ action_label }}</button>
        </div>
    </form>
</section>
<script>
    const fuelBeforeInput = document.querySelector('[data-fuel-before-refill]');
    const fuelAfterInput = document.querySelector('[data-fuel-after-refill]');
    const litresIssuedInput = document.querySelector('[data-fuel-litres-issued]');

    function calculateFuelRefillLitres() {
        if (!fuelBeforeInput || !fuelAfterInput || !litresIssuedInput) return;
        const beforeValue = Number.parseFloat(fuelBeforeInput.value || '0');
        const afterValue = Number.parseFloat(fuelAfterInput.value || '0');
        if (Number.isNaN(beforeValue) || Number.isNaN(afterValue) || afterValue < beforeValue) {
            litresIssuedInput.value = '';
            return;
        }
        litresIssuedInput.value = (afterValue - beforeValue).toFixed(3);
    }

    fuelBeforeInput?.addEventListener('input', calculateFuelRefillLitres);
    fuelAfterInput?.addEventListener('input', calculateFuelRefillLitres);
    calculateFuelRefillLitres();
</script>
{% endblock %}
